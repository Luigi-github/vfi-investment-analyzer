name: Refresh Colombia Market Data (Free)

on:
  pull_request:
    paths:
      - "app/data/market_data.py"
      - "app/data/market_data_store.py"
      - "app/data/sfc_reference.py"
      - "scripts/refresh_colombia_market_data.py"
      - "scripts/run_cycle_analysis.py"
      - ".github/workflows/refresh-colombia-market-data.yml"
  workflow_dispatch:
  schedule:
    # 16:30 Colombia time (UTC-5), after the local market session.
    - cron: "30 21 * * 1-5"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore previous local cache
        uses: actions/cache/restore@v4
        with:
          path: data/market_cache/colombia
          key: colombia-market-cache-${{ github.run_id }}
          restore-keys: |
            colombia-market-cache-

      - name: Run data-quality unit tests
        run: |
          python -m unittest discover -s tests -p "test_market_data_store.py"
          python -m unittest discover -s tests -p "test_weekly_missing_data_fill.py"

      - name: Diagnose public StockAnalysis history pagination
        run: python scripts/debug_stockanalysis_pagination.py

      - name: Refresh Colombian daily OHLCV
        continue-on-error: true
        run: |
          python scripts/refresh_colombia_market_data.py \
            --data-dir data/market_cache/colombia \
            --max-stale-days 7

      - name: Run VFI Colombia analysis with validated data
        continue-on-error: true
        run: |
          python scripts/run_cycle_analysis.py \
            --universe COLOMBIA \
            --output-dir reports/colombia_latest

      - name: Upload data, audit and VFI ranking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colombia-vfi-data-and-ranking-${{ github.run_id }}
          path: |
            data/market_cache/colombia/
            reports/colombia_latest/
          if-no-files-found: warn
          retention-days: 30

      - name: Save updated cache for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/market_cache/colombia
          key: colombia-market-cache-${{ github.run_id }}
