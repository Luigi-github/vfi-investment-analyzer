name: Free Binance Top-200 MTF Backtests

on:
  workflow_dispatch:
  # Re-run the full suite when this workflow itself changes, but not on every
  # ordinary application/script push (a 200-symbol run is intentionally manual).
  push:
    branches: [main]
    paths:
      - ".github/workflows/crypto-mtf-backtest.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: free-binance-top200-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover top 200 liquid Binance symbols
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      symbols: ${{ steps.universe.outputs.symbols }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build ranked universe
        id: universe
        shell: bash
        run: |
          python scripts/discover_top_binance_symbols.py > /tmp/universe.json
          python -c "import json; p=json.load(open('/tmp/universe.json')); print('symbols='+json.dumps(p['symbols'], separators=(',',':')))" >> "$GITHUB_OUTPUT"
          cp /tmp/universe.json reports-universe.json
      - name: Upload universe definition
        uses: actions/upload-artifact@v4
        with:
          name: binance-universe-definition
          path: reports-universe.json
          retention-days: 7

  backtest:
    name: Backtest ${{ matrix.symbol }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        symbol: ${{ fromJson(needs.discover.outputs.symbols) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run MTF ranking for symbol
        run: python -u scripts/run_crypto_mtf_analysis.py --symbols "${{ matrix.symbol }}" --min-volume 0 --top 1 --output-dir "reports/free_cloud_backtest/per_symbol/${{ matrix.symbol }}/mtf"
      - name: Run walk-forward strategy backtest
        run: python -u scripts/run_crypto_mtf_real_backtest.py --symbols "${{ matrix.symbol }}" --output-dir "reports/free_cloud_backtest/per_symbol/${{ matrix.symbol }}/backtest"
      - name: Prepare compact artifact folder
        if: always()
        run: |
          base="reports/free_cloud_backtest/per_symbol/${{ matrix.symbol }}"
          dest="artifact/${{ matrix.symbol }}"
          mkdir -p "$dest/mtf" "$dest/backtest"
          for f in crypto_mtf_ranking.csv derivatives_snapshot.csv; do
            [ ! -f "$base/mtf/$f" ] || cp "$base/mtf/$f" "$dest/mtf/$f"
          done
          for f in strategy_pnl_comparison.csv walk_forward_oos.csv oos_trades.csv walk_forward_summary.csv backtest_status.csv; do
            [ ! -f "$base/backtest/$f" ] || cp "$base/backtest/$f" "$dest/backtest/$f"
          done
      - name: Upload per-symbol results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-${{ matrix.symbol }}
          path: artifact/**
          if-no-files-found: warn
          retention-days: 7

  aggregate:
    name: Aggregate reports and preserve partial results
    if: always() && needs.discover.result == 'success'
    needs: [discover, backtest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download completed per-symbol artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crypto-mtf-*
          path: reports/free_cloud_backtest/per_symbol
          merge-multiple: true
          if-no-artifact-found: ignore
      - name: Save universe and progress checkpoint
        env:
          SYMBOLS_JSON: ${{ needs.discover.outputs.symbols }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path("reports/free_cloud_backtest")
          root.mkdir(parents=True, exist_ok=True)
          symbols = json.loads(os.environ["SYMBOLS_JSON"])
          (root / "universe.txt").write_text("\n".join(symbols) + "\n", encoding="utf-8")
          completed = []
          no_oos_trades = []
          insufficient_history = []
          failed_symbols = []
          missing_status = []
          for symbol in symbols:
              status_file = root / "per_symbol" / symbol / "backtest" / "backtest_status.csv"
              if not status_file.exists() or not status_file.stat().st_size:
                  missing_status.append(symbol)
                  continue
              import pandas as pd
              status_frame = pd.read_csv(status_file)
              if status_frame.empty or not {"Symbol", "Status"}.issubset(status_frame.columns):
                  missing_status.append(symbol)
                  continue
              status = str(status_frame.iloc[0]["Status"])
              if status == "completed":
                  completed.append(symbol)
              elif status == "no_oos_trades":
                  no_oos_trades.append(symbol)
              elif status == "insufficient_history":
                  insufficient_history.append(symbol)
              else:
                  failed_symbols.append(symbol)
          failed_or_missing = sorted(set(missing_status + insufficient_history + failed_symbols))
          if failed_or_missing:
              run_status = "partial"
          elif no_oos_trades:
              run_status = "completed_with_warnings"
          else:
              run_status = "completed"
          manifest = {
              "selection_method": "Top 200 intersection of Binance USDT spot and USD-M perpetual markets ranked by combined 24h quote-volume ranks",
              "symbols": symbols,
              "completed": sorted(completed),
              "no_oos_trades": sorted(no_oos_trades),
              "insufficient_history": sorted(insufficient_history),
              "failed_symbols": sorted(failed_symbols),
              "missing_status": sorted(missing_status),
              "failed_or_missing": failed_or_missing,
              "status": run_status,
          }
          (root / "checkpoint.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print(f"Completed artifacts: {len(completed)}/{len(symbols)}")
          PY
      - name: Aggregate CSV reports
        run: python scripts/aggregate_crypto_backtests.py --output-dir reports/free_cloud_backtest
      - name: Upload consolidated results, including partial results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-top200-results-${{ github.run_number }}
          path: reports/free_cloud_backtest/
          if-no-files-found: warn
          retention-days: 30
