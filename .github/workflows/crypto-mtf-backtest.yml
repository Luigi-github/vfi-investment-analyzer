name: Crypto Binance MTF Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run multi-timeframe ranking
        run: python scripts/run_crypto_mtf_analysis.py --symbols AUTO --min-volume 10000000 --top 20 --output-dir reports/crypto_mtf
      - name: Run historical confluence backtest
        run: python scripts/run_crypto_mtf_backtest.py --symbols BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT --output-dir reports/crypto_mtf_backtest
      - name: Upload MTF research
        uses: actions/upload-artifact@v4
        with:
          name: crypto-binance-mtf-full
          path: reports/
