name: Crypto Binance MTF Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run multi-timeframe ranking
        run: python scripts/run_crypto_mtf_analysis.py --symbols AUTO --min-volume 10000000 --top 200 --output-dir reports/crypto_mtf
      - name: Run purged walk-forward real backtest on the same Binance universe
        run: python scripts/run_crypto_mtf_real_backtest.py --symbols AUTO --output-dir reports/crypto_mtf_real_backtest
      - name: Upload MTF research
        uses: actions/upload-artifact@v4
        with:
          name: crypto-binance-mtf-full
          path: reports/
