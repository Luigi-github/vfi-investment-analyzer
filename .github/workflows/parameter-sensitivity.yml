name: VFI Parameter Sensitivity

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Research universe"
        required: true
        default: "USA_STOCKS"
        type: choice
        options:
          - ALL
          - USA_STOCKS
          - USA_ETFS
          - CRYPTO
          - COLOMBIA
          - CHILE
          - LATAM
          - COMMODITIES_ETFS
      symbols:
        description: "Optional comma-separated symbols"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "0 4 1 * *"

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run parameter sensitivity
        env:
          RESEARCH_UNIVERSE: ${{ inputs.universe || 'USA_STOCKS' }}
          RESEARCH_SYMBOLS: ${{ inputs.symbols || '' }}
        run: |
          ARGS="--universe $RESEARCH_UNIVERSE"
          if [ -n "$RESEARCH_SYMBOLS" ]; then
            ARGS="$ARGS --symbols $RESEARCH_SYMBOLS"
          fi
          python scripts/run_parameter_sensitivity.py $ARGS
      - name: Upload sensitivity reports
        uses: actions/upload-artifact@v4
        with:
          name: vfi-parameter-sensitivity
          path: reports/parameter_sensitivity/
