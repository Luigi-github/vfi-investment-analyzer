name: Crypto Binance Multi-Timeframe Research

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  crypto-mtf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Binance multi-timeframe analysis
        run: python scripts/run_crypto_mtf_analysis.py --symbols AUTO --min-volume 10000000 --top 20 --output-dir reports/crypto_mtf
      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: crypto-binance-mtf
          path: reports/crypto_mtf/
