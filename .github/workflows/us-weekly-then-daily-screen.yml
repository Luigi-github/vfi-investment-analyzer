name: US top-liquid-100 weekly-first early accumulation screen

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_us_weekly_then_daily_screen.py"
      - ".github/workflows/us-weekly-then-daily-screen.yml"
      - "scripts/run_volume_accumulation_indicators.py"
      - "app/indicators/vfi.py"
      - "app/indicators/volume_divergence_mm.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-only-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile project
        run: python -m compileall app scripts
      - name: Run relevant tests
        run: |
          PYTHONPATH=. pytest -q tests/test_volume_accumulation_indicators.py tests/test_volume_divergence_mm.py tests/test_vfi_conformance.py tests/test_vfi_slope_units.py
      - name: Rank liquidity and screen completed weekly VFI only
        run: python scripts/run_us_weekly_then_daily_screen.py --period max --top 100
      - name: Upload weekly-only VFI ranking and run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top100-weekly-vfi-only
          path: reports/us_weekly_then_daily/
          if-no-files-found: warn
          retention-days: 14

# Weekly-only screen: daily OHLCV is used only for the liquidity ranking.
