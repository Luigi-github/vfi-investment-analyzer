name: US top-200-liquid weekly-first early accumulation screen

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_us_weekly_then_daily_screen.py"
      - "scripts/build_us_three_rankings.py"
      - ".github/workflows/us-weekly-then-daily-screen.yml"
      - "scripts/run_volume_accumulation_indicators.py"
      - "app/indicators/vfi.py"
      - "app/indicators/volume_divergence_mm.py"
      - "tests/test_vfi_signal_lengths.py"
  pull_request:
    paths:
      - "scripts/run_us_weekly_then_daily_screen.py"
      - ".github/workflows/us-weekly-then-daily-screen.yml"
      - "scripts/run_volume_accumulation_indicators.py"
      - "app/indicators/vfi.py"
      - "app/indicators/volume_divergence_mm.py"
      - "tests/test_vfi_signal_lengths.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-only-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Restore cached OHLCV history
        uses: actions/cache@v4
        with:
          path: data/market_cache/us_equities
          key: us-ohlcv-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            us-ohlcv-${{ runner.os }}-
      - name: Compile project
        run: python -m compileall app scripts
      - name: Run relevant tests
        run: |
          PYTHONPATH=. pytest -q tests/test_vfi_signal_lengths.py tests/test_volume_accumulation_indicators.py tests/test_volume_divergence_mm.py tests/test_vfi_conformance.py tests/test_vfi_slope_units.py
      - name: Rank liquidity and screen completed weekly VFI only
        run: python scripts/run_us_weekly_then_daily_screen.py --period max --top 200 --max-daily-candidates 100 --refresh-cache
      - name: Calculate monthly Volume Divergence MM and combined rankings for the same 200 assets
        run: python scripts/build_us_three_rankings.py
      - name: Upload weekly, monthly, combined rankings and run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top200-three-rankings
          path: reports/us_weekly_then_daily/
          if-no-files-found: warn
          retention-days: 14

# Weekly-first design: rank the curated US-listed universe by mean Close*Volume over 20 completed sessions,
# select the top 100, analyze all selected assets on completed weekly candles, and only then analyze daily
# the assets passing the weekly early-accumulation filter. Daily analysis never runs on non-qualifiers.
# Uses completed candles only; cache can be refreshed by adding --refresh-cache to the script command.
