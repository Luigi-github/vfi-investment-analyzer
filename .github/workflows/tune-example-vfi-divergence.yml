name: Tune Example VFI + Weekly Divergence Parameters

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/tune_example_vfi_divergence_parameters.py"
      - "tests/test_example_parameter_tuning.py"
      - ".github/workflows/tune-example-vfi-divergence.yml"
      - "app/indicators/vfi.py"
      - "app/indicators/volume_divergence_mm.py"

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run parameter tuning on example assets
        run: python scripts/tune_example_vfi_divergence_parameters.py --output-dir reports/example_parameter_tuning | tee example_parameter_tuning_console.txt
      - name: Upload parameter sensitivity reports
        uses: actions/upload-artifact@v4
        with:
          name: example-vfi-divergence-parameter-tuning
          path: |
            reports/example_parameter_tuning/
            example_parameter_tuning_console.txt
          if-no-files-found: error
          retention-days: 90
