name: Weekly EMA Period Optimization

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated yfinance symbols"
        required: false
        default: "DDD,INTC,NVDA,BTC-USD"
  pull_request:
    paths:
      - "scripts/optimize_ema_periods.py"
      - "tests/test_ema_optimization.py"
      - ".github/workflows/ema-optimization.yml"
      - "app/indicators/vfi.py"
      - "app/data/market_data.py"

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest tests.test_ema_optimization -v
      - name: Run weekly EMA optimization
        env:
          EMA_SYMBOLS: ${{ github.event.inputs.symbols || 'DDD,INTC,NVDA,BTC-USD' }}
        run: python scripts/optimize_ema_periods.py --symbols "$EMA_SYMBOLS"
      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-ema-optimization-reports
          path: reports/ema_optimization/
          if-no-files-found: warn
          retention-days: 30
