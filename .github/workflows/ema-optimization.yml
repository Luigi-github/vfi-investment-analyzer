name: Weekly and Daily EMA Optimization

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated Yahoo Finance symbols"
        required: false
        default: "DDD,INTC,NVDA,BTC-USD,EC,CIB,MSFT,EEM,SQM,LTC-USD,AU,SPY,AMZN,PBR,NU,QQQ,ISA.CL,GEB.CL,MINEROS.CL,PFAVAL.CL,PFDAVVNDA.CL,TERPEL.CL"
  pull_request:
    paths:
      - "scripts/optimize_ema_periods.py"
      - "scripts/optimize_daily_volume_divergence_ema.py"
      - "scripts/study_early_vfi_accumulation.py"
      - "tests/test_ema_optimization.py"
      - "tests/test_daily_volume_divergence_ema.py"
      - "tests/test_comparable_accumulation_score.py"
      - ".github/workflows/ema-optimization.yml"
      - "app/indicators/vfi.py"
      - "app/indicators/volume_divergence_mm.py"
      - "app/data/market_data.py"

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run EMA optimization tests
        run: |
          python -m unittest discover -s tests -p "test_ema_optimization.py" -v
          python -m unittest discover -s tests -p "test_daily_volume_divergence_ema.py" -v
          python -m unittest discover -s tests -p "test_comparable_accumulation_score.py" -v
      - name: Run weekly EMA optimization
        env:
          EMA_SYMBOLS: ${{ github.event.inputs.symbols || 'DDD,INTC,NVDA,BTC-USD,EC,CIB,MSFT,EEM,SQM,LTC-USD,AU,SPY,AMZN,PBR,NU,QQQ,ISA.CL,GEB.CL,MINEROS.CL,PFAVAL.CL,PFDAVVNDA.CL,TERPEL.CL' }}
        run: python scripts/optimize_ema_periods.py --symbols "$EMA_SYMBOLS"
      - name: Run early VFI accumulation scan (EMA on VFI 130)
        env:
          EMA_SYMBOLS: ${{ github.event.inputs.symbols || 'DDD,INTC,NVDA,BTC-USD,EC,CIB,MSFT,EEM,SQM,LTC-USD,AU,SPY,AMZN,PBR,NU,QQQ,ISA.CL,GEB.CL,MINEROS.CL,PFAVAL.CL,PFDAVVNDA.CL,TERPEL.CL' }}
        run: python scripts/study_early_vfi_accumulation.py --symbols "$EMA_SYMBOLS"
      - name: Run daily Volume Divergence + EMA optimization
        env:
          EMA_SYMBOLS: ${{ github.event.inputs.symbols || 'DDD,INTC,NVDA,BTC-USD,EC,CIB,MSFT,EEM,SQM,LTC-USD,AU,SPY,AMZN,PBR,NU,QQQ,ISA.CL,GEB.CL,MINEROS.CL,PFAVAL.CL,PFDAVVNDA.CL,TERPEL.CL' }}
        run: python scripts/optimize_daily_volume_divergence_ema.py --symbols "$EMA_SYMBOLS"
      - name: Upload research reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-daily-ema-optimization-reports
          path: |
            reports/ema_optimization/
            reports/daily_volume_divergence_ema/
            reports/early_vfi_accumulation/
          if-no-files-found: warn
          retention-days: 30
