name: Crypto MTF Real Strategy Backtest

# This workflow is manual-only; free cloud execution is handled by
# scripts/run_resumable_crypto_backtests.py on a free cloud VM.
on:
  workflow_dispatch:

jobs:
  real-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run causal walk-forward backtest
        run: python scripts/run_crypto_mtf_real_backtest.py --symbols BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT --output-dir reports/crypto_mtf_real_backtest
      - name: Upload real backtest
        uses: actions/upload-artifact@v4
        with:
          name: crypto-mtf-real-backtest
          path: reports/crypto_mtf_real_backtest/
