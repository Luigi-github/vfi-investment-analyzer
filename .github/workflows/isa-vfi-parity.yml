name: ISA VFI TradingView parity diagnostic

on:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_isa_vfi.py"
      - ".github/workflows/isa-vfi-parity.yml"
      - "app/indicators/vfi.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run adjusted vs unadjusted diagnostic
        run: python scripts/diagnose_isa_vfi.py
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: isa-vfi-parity-diagnostic
          path: isa_vfi_diagnostic.json
          retention-days: 30
