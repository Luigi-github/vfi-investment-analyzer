name: Real Cycle Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  cycle-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run real cycle analysis
        run: python scripts/run_cycle_analysis.py

      - name: Upload cycle analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: vfi-cycle-analysis
          path: reports/cycle_analysis/
