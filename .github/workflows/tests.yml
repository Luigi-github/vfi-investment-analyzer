name: Tests

on:
  push:
    branches:
      - main
      - audit/agents
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile project
        run: python -m compileall app scripts dashboard

      - name: Smoke-test research entry points
        run: |
          python scripts/run_full_research.py --help
          python scripts/run_cycle_analysis.py --help
          python scripts/run_portfolio_backtest.py --help
          python scripts/optimize_ema_periods.py --help
          python scripts/optimize_daily_volume_divergence_ema.py --help
          python scripts/study_early_vfi_accumulation.py --help

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
