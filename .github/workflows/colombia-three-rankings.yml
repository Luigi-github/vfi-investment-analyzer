name: Colombia - automatic three rankings

on:
  workflow_dispatch:
  schedule:
    # 23:30 UTC = 18:30 Colombia time. Daily refresh; weekly/monthly bars
    # are based only on completed daily observations available from Yahoo.
    - cron: "30 23 * * 1-5"
  pull_request:
    branches: [main]
    paths:
      - "tests/test_colombia_three_rankings.py"
      - "scripts/run_colombia_three_rankings.py"
      - "app/indicators/**"
      - "app/scoring/**"
      - "app/research/universes.py"
      - ".github/workflows/colombia-three-rankings.yml"
  push:
    branches: [main]
    paths:
      - "scripts/run_colombia_three_rankings.py"
      - "app/indicators/**"
      - "app/scoring/**"
      - "app/research/universes.py"
      - ".github/workflows/colombia-three-rankings.yml"

permissions:
  contents: write

concurrency:
  group: colombia-three-rankings
  cancel-in-progress: false

jobs:
  rankings:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run focused pipeline tests
        run: python -m unittest discover -s tests -p "test_colombia_three_rankings.py" -v

      - name: Run all Colombia rankings
        run: python scripts/run_colombia_three_rankings.py --output-dir reports/colombia_three_rankings

      - name: Publish latest ranking files to repository
        if: github.event_name != 'pull_request' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/colombia_three_rankings/*.csv reports/colombia_three_rankings/*.json
          git add -f reports/colombia_three_rankings/*.log
          if git diff --cached --quiet; then
            echo "No ranking output changes to publish."
          else
            git commit -m "Update automatic Colombia rankings [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload rankings and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colombia-three-rankings-${{ github.run_number }}
          path: |
            reports/colombia_three_rankings/
          if-no-files-found: warn
          retention-days: 90
