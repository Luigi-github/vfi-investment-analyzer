name: Portfolio Research

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Research universe"
        required: true
        default: "ALL"
        type: choice
        options:
          - ALL
          - USA_STOCKS
          - USA_ETFS
          - CRYPTO
          - COLOMBIA
          - CHILE
          - LATAM
          - COMMODITIES_ETFS
      symbols:
        description: "Optional comma-separated symbols"
        required: false
        default: ""
        type: string
      capital:
        description: "Reference portfolio capital"
        required: true
        default: "100000"
        type: string
      apply_liquidity_filter:
        description: "Apply point-in-time liquidity capacity filter"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "30 2 * * 6"

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run portfolio backtest
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESEARCH_UNIVERSE: ${{ inputs.universe || 'ALL' }}
          RESEARCH_SYMBOLS: ${{ inputs.symbols || '' }}
          RESEARCH_CAPITAL: ${{ inputs.capital || '100000' }}
          APPLY_LIQUIDITY: ${{ inputs.apply_liquidity_filter || 'false' }}
        run: |
          ARGS=(--universe "$RESEARCH_UNIVERSE" --capital "$RESEARCH_CAPITAL")
          if [ -n "$RESEARCH_SYMBOLS" ]; then
            ARGS+=(--symbols "$RESEARCH_SYMBOLS")
          fi
          if [ "$APPLY_LIQUIDITY" = "true" ]; then
            ARGS+=(--apply-liquidity-filter)
          fi
          python scripts/run_portfolio_backtest.py "${ARGS[@]}"
      - name: Upload portfolio reports
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-backtest
          path: reports/portfolio_backtest/
