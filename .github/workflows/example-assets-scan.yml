name: Example assets accumulation scan

on:
  push:
    branches:
      - fix/daily-vfi-slope-semantics
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example-assets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile project
        run: python -m compileall app scripts
      - name: Run example assets screen
        run: python scripts/run_example_assets_accumulation_screen.py --period max
      - name: Upload example assets report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-assets-accumulation-report
          path: reports/example_assets_accumulation/
          if-no-files-found: warn
          retention-days: 14
