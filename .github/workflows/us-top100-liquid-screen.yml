name: US top 100 liquid early accumulation screen

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_us_top100_liquid_screen.py"
      - ".github/workflows/us-top100-liquid-screen.yml"
      - "scripts/run_example_assets_accumulation_screen.py"
      - "scripts/run_volume_accumulation_indicators.py"
      - "app/indicators/**"
      - "app/research/accumulation_breakout_screen.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  us-top100-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install pandas numpy yfinance requests python-dotenv pytest
      - name: Compile project
        run: python -m compileall app scripts
      - name: Run unit tests
        run: |
          if [ -f tests/test_volume_accumulation_indicators.py ]; then
            python -m unittest tests/test_volume_accumulation_indicators.py
          fi
      - name: Analyze top 100 liquid US-listed candidates
        run: python scripts/run_us_top100_liquid_screen.py --period max --top 100
      - name: Upload ranking and source universe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top100-liquid-early-accumulation
          path: reports/us_top100_liquid/
          if-no-files-found: warn
          retention-days: 14
