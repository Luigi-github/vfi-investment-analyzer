name: VFI Volume Divergence Study

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run event study
        run: python scripts/vfi_divergence_study.py | tee vfi_divergence_console.txt
      - name: Upload event study
        uses: actions/upload-artifact@v4
        with:
          name: vfi-volume-divergence-study
          path: |
            vfi_divergence_events.csv
            vfi_divergence_summary.csv
            vfi_divergence_errors.csv
            vfi_divergence_console.txt
          if-no-files-found: warn
