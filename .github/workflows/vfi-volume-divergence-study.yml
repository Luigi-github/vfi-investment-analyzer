name: VFI Volume Divergence Study

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run focused daily VFI + weekly divergence study
        run: python scripts/vfi_accumulation_divergence_study.py | tee vfi_accumulation_divergence_console.txt
      - name: Upload study reports
        uses: actions/upload-artifact@v4
        with:
          name: vfi-accumulation-divergence-study
          path: |
            reports/vfi_accumulation_divergence/
            vfi_accumulation_divergence_console.txt
          if-no-files-found: error
          retention-days: 30
