name: US Top 100 Weekly-First VFI Screen

on:
  push:
    branches:
      - main
    paths:
      - "scripts/run_us_top100_weekly_daily.py"
      - ".github/workflows/us-top100-weekly-daily.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile screen
        run: python -m py_compile scripts/run_us_top100_weekly_daily.py app/indicators/vfi.py app/data/market_data.py

      - name: Run weekly-first then daily VFI screen
        run: python scripts/run_us_top100_weekly_daily.py

      - name: Upload screening reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-top100-weekly-daily-vfi
          path: reports/us_top100_weekly_daily/
          if-no-files-found: warn
          retention-days: 30
