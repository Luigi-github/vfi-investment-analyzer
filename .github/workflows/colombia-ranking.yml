name: Colombia VFI Ranking

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  colombia-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Colombia VFI research
        run: python scripts/run_cycle_analysis.py --universe COLOMBIA --output-dir reports/colombia_ranking

      - name: Upload Colombia ranking
        uses: actions/upload-artifact@v4
        with:
          name: vfi-colombia-ranking
          path: reports/colombia_ranking/
