name: US liquid 100 daily and weekly accumulation ranking

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_us_liquid_100_screen.py"
      - "scripts/run_example_assets_accumulation_screen.py"
      - "scripts/run_volume_accumulation_indicators.py"
      - ".github/workflows/us-liquid-100-ranking.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  us-liquid-100-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile project
        run: python -m compileall app scripts
      - name: Run unit tests
        run: PYTHONPATH=. pytest -q tests/test_accumulation_breakout_screen.py tests/test_volume_accumulation_indicators.py tests/test_volume_divergence_mm.py tests/test_vfi_conformance.py tests/test_vfi_slope_units.py tests/test_vfi_two_stage_opportunity_filter.py
      - name: Analyze 100 US-listed liquid assets on daily and weekly timeframes
        run: python scripts/run_us_liquid_100_screen.py --period max
      - name: Upload ranking and detailed reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-liquid-100-daily-weekly-ranking
          path: reports/us_liquid_100/
          if-no-files-found: warn
          retention-days: 14
